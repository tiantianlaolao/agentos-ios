name: Build iOS Ad-Hoc & Deploy OTA

on:
  workflow_dispatch:
    inputs:
      backend:
        description: 验收环境（生产创作包关闭积分购买）
        type: choice
        default: test
        options: [test, production-creation]
      build_number:
        description: 经核对的下一构建号
        required: true
        type: string
  push:
    tags:
      - 'adhoc-v*'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using Xcode: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Validate Coder link parsing and login continuation (no simulator)
        run: python3 scripts/validate-coder-links.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install certificates
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_DEV_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEV_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_DEV_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEV_CERTIFICATE_PASSWORD }}
        run: |
          DIST_CERT=$RUNNER_TEMP/dist.p12
          DEV_CERT=$RUNNER_TEMP/dev.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 12)

          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o $DIST_CERT
          echo -n "$APPLE_DEV_CERTIFICATE_BASE64" | base64 --decode -o $DEV_CERT

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $DIST_CERT -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security import $DEV_CERT -P "$APPLE_DEV_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Install Ad-Hoc Provisioning Profile
        env:
          APPLE_ADHOC_PROFILE_BASE64: ${{ secrets.APPLE_ADHOC_PROFILE_BASE64 }}
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo -n "$APPLE_ADHOC_PROFILE_BASE64" | base64 --decode -o "$PROFILE_DIR/AgentOS_AdHoc.mobileprovision"

          PROFILE_UUID=$(security cms -D -i "$PROFILE_DIR/AgentOS_AdHoc.mobileprovision" | plutil -extract UUID raw -)
          PROFILE_NAME=$(security cms -D -i "$PROFILE_DIR/AgentOS_AdHoc.mobileprovision" | plutil -extract Name raw -)
          echo "Profile UUID: $PROFILE_UUID"
          echo "Profile Name: $PROFILE_NAME"
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV

      - name: Setup App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo -n "$ASC_API_KEY_BASE64" | base64 --decode -o ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Select backend and build number
        env:
          REQUESTED_BACKEND: ${{ inputs.backend }}
          REQUESTED_BUILD: ${{ inputs.build_number }}
        run: |
          BACKEND="${REQUESTED_BACKEND:-test}"
          BUILD_NUM="${REQUESTED_BUILD:-$(git rev-list --count HEAD)}"
          [[ "$BUILD_NUM" =~ ^[1-9][0-9]{0,3}$ ]] || { echo 'Invalid build number'; exit 1; }
          case "$BACKEND" in
            test) CONDITIONS=ADHOC_TEST ;;
            production-creation) CONDITIONS=CODER_CREATION_ONLY ;;
            *) echo 'Unknown backend'; exit 1 ;;
          esac
          echo "BACKEND=$BACKEND" >> "$GITHUB_ENV"
          echo "BUILD_NUM=$BUILD_NUM" >> "$GITHUB_ENV"
          echo "BUILD_CONDITIONS=$CONDITIONS" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" AgentOS/Resources/Info.plist
          ACTUAL_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" AgentOS/Resources/Info.plist)
          [[ "$ACTUAL_BUILD" == "$BUILD_NUM" ]] || exit 1

      - name: Build archive for selected backend
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -scheme AgentOS \
            -project AgentOS.xcodeproj \
            -archivePath "$RUNNER_TEMP/AgentOS.xcarchive" \
            -sdk iphoneos \
            -configuration Release \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUM" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="$BUILD_CONDITIONS" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Export IPA (ad-hoc)
        id: export_ipa
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.agentosplus.app</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/AgentOS.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

          ls -la $RUNNER_TEMP/export/

      - name: Validate exported IPA and prepare versioned OTA page
        run: python3 scripts/prepare-ota-artifacts.py

      - name: Preserve signed package and validation report
        if: ${{ always() && steps.export_ipa.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: AIHEY-${{ env.BACKEND }}-${{ env.BUILD_NUM }}
          path: ${{ runner.temp }}/export/

      - name: Deploy to OTA server
        env:
          OTA_SSH_HOST: ${{ secrets.OTA_SSH_HOST }}
          OTA_SSH_USER: ${{ secrets.OTA_SSH_USER }}
          OTA_SSH_PASSWORD: ${{ secrets.OTA_SSH_PASSWORD }}
        run: |
          brew install hudochenkov/sshpass/sshpass

          sshpass -p "$OTA_SSH_PASSWORD" ssh -o StrictHostKeyChecking=no \
            $OTA_SSH_USER@$OTA_SSH_HOST \
            "mkdir -p /var/www/test-install/$OTA_SUBDIR"

          sshpass -p "$OTA_SSH_PASSWORD" scp -o StrictHostKeyChecking=no \
            "$RUNNER_TEMP/export/$IPA_NAME" \
            "$RUNNER_TEMP/export/manifest.plist" \
            "$RUNNER_TEMP/export/install.html" \
            "$RUNNER_TEMP/export/verification.json" \
            $OTA_SSH_USER@$OTA_SSH_HOST:/var/www/test-install/$OTA_SUBDIR/

          sshpass -p "$OTA_SSH_PASSWORD" ssh -o StrictHostKeyChecking=no \
            $OTA_SSH_USER@$OTA_SSH_HOST \
            "python3 - \"$OTA_SUBDIR\"" < scripts/publish-ota.py

      - name: Print install URL
        run: |
          echo "=========================================="
          echo " OTA Install URL (open in iPhone Safari):"
          echo " https://agentos.tybbtech.com:3201/test-install/install.html"
          echo "=========================================="
          echo " Build: ${VERSION} (${BUILD_NUM})"
          echo " IPA: ${IPA_NAME}"
          echo "=========================================="

      - name: Clean up
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
